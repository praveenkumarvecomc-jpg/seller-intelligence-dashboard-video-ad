<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Seller Intelligence Ad v4</title>
<link rel="stylesheet" href="./fonts4.css">
<style>
:root{
  /* dark charcoal (not near-black) */
  --bg:#22272F; --bg2:#292F39; --card:#2A303A; --card2:#323944; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
  --tx:#F5F6F8; --mu:#AAB1BD; --mu2:#828A98;
  --or:#F7931E; --or2:#FFB04A; --gr:#3CCB7F; --rd:#F0645A; --pu:#9384F5; --bl:#4C8DF6; --am:#F2B33D;
  --H:"Jakarta","Inter",sans-serif; --T:"Inter",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);overflow:hidden}
#wrap{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--T);color:var(--tx);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#bgc{position:absolute;inset:0}
.layer{position:absolute;inset:0}
.sc{position:absolute;left:0;top:0;width:1920px;height:1080px}
.px{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.card{position:absolute;background:linear-gradient(180deg,#2D343F 0%,#262C35 100%);border:1px solid var(--line);border-radius:26px;box-shadow:0 36px 80px rgba(8,10,14,.38),0 1px 0 rgba(255,255,255,.05) inset}
.card.flat{box-shadow:none}
.ttl{font-family:var(--H);font-weight:700;font-size:28px;color:var(--tx);letter-spacing:-.015em}
.sub{font-size:18px;color:var(--mu)}
.lbl{font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.num{font-family:var(--H);font-weight:800;letter-spacing:-.025em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 16px;font-size:17px;font-weight:600;white-space:nowrap}
.mask{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.mask>span{display:inline-block}
.ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.track{position:relative;height:12px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.row{display:flex;align-items:center}
.nw{white-space:nowrap}
svg{overflow:visible}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bgc" width="1920" height="1080"></canvas>
  <div id="scenes" class="layer"></div>
  <div id="hookL" class="layer"></div>
  <div id="brandL" class="layer"></div>
  <div id="chrome" class="layer"></div>
  <div id="caps" class="layer"></div>
  <div id="ctaL" class="layer"></div>
  <div id="fxL" class="layer" style="pointer-events:none"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
